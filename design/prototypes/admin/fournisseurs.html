<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design SS DROPSHIP — Administration humaine & Bogolan</title><style>
:root{--navy:#10213D;--blue:#0077C8;--red:#F21A16;--white:#fff;--pale:#f2f7fc}*{box-sizing:border-box}body{margin:0;background:#edf4fa;font:14px/1.5 system-ui,Arial;color:var(--navy)}header{padding:26px max(20px,calc((100vw - 1200px)/2));background:var(--navy);color:white}header b{font-size:25px}header b span{color:#ff3434}header p{color:#d1e6f5}main{max-width:1200px;margin:25px auto;padding:0 15px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.toolbar button{border:1px solid #cbddea;background:white;border-radius:12px;padding:10px 13px;cursor:pointer;color:var(--navy);font-weight:700}.toolbar button.active{background:var(--red);color:white}.board{display:grid;grid-template-columns:200px 1fr;min-height:690px;background:white;border-radius:24px;overflow:hidden;box-shadow:0 15px 40px #142c481c}.side{background:var(--navy);padding:22px 13px;color:white}.side h2{font-size:18px;margin:0 0 15px}.side button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#e7f0fa;padding:10px 9px;text-align:left;border-radius:11px;cursor:pointer}.side button.active{background:var(--red);color:white}.side img,.tile img{width:25px;height:25px;object-fit:contain}.screen{padding:24px 28px;background:linear-gradient(140deg,#f7fbff,#fff)}.hero{display:flex;align-items:center;justify-content:space-between;gap:15px;background:linear-gradient(115deg,#e4f4ff,#fff);border:1px solid #dbeaf6;border-radius:20px;padding:20px}.hero h1{font-size:clamp(21px,3vw,30px);margin:0 0 8px}.hero p{margin:0;color:#52677c}.person{font-size:55px;min-width:90px;text-align:center}.motif{height:12px;margin:16px 0;background:repeating-linear-gradient(90deg,var(--navy) 0 5px,white 5px 9px,var(--red) 9px 13px,white 13px 18px,var(--blue) 18px 23px,white 23px 28px);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.tile{background:white;border:1px solid #d9e7f2;border-radius:16px;padding:15px;box-shadow:0 5px 12px #0a35500b}.tile strong{display:block;font-size:22px;margin:6px 0}.tile small{color:#61758a}.tile img{width:32px;height:32px}.panel{border:1px solid #d9e7f2;background:white;border-radius:17px;padding:16px;overflow:auto}.panel h3{margin:0 0 12px}.panel table{width:100%;border-collapse:collapse;min-width:460px}td,th{padding:12px 10px;text-align:left;border-bottom:1px solid #e8eff5}th{font-size:11px;color:#65778b;text-transform:uppercase}.pill{border-radius:50px;background:#e7f4ff;color:#005b9d;padding:4px 9px;font-size:11px;font-weight:700}.notice{margin-top:15px;color:#5b6e82;font-size:12px}.foot{font-size:12px;color:#60758a;margin-top:15px}@media(max-width:750px){.board{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:5px;align-items:center;padding:10px}.side h2{display:none}.side button{white-space:nowrap;width:auto}.screen{padding:15px}.metrics{grid-template-columns:1fr 1fr}.person{font-size:38px;min-width:45px}.hero{padding:14px}}</style><style>.hero{min-height:170px}.person{font-size:75px;filter:drop-shadow(0 6px 6px #0d2b4333)}.tile{transition:transform .2s}.tile:hover{transform:translateY(-3px)}.hero:after{content:'◆ ◇ ◆';font-size:18px;letter-spacing:6px;color:#F21A16;align-self:flex-end}@media(max-width:750px){.person{font-size:48px}}</style></head><body>
<header><b>SS <span>DROPSHIP</span></b><p>Design SS DROPSHIP · Huit écrans d'administration · Identité Bogolan</p></header><main><div class="toolbar" id="toolbar"></div><div class="board"><aside class="side" id="side"><h2>Administration</h2></aside><section class="screen" id="screen"></section></div><p class="foot">Prototype de présentation uniquement. Les chiffres, fournisseurs, clients et transactions sont fictifs. Aucun paiement, retrait ni accès admin réel n'est activé.</p></main>
<script>
const root='../../icons/bogolan/png/';
const screens=[
{title:'Fournisseurs',icon:'store',person:'👨🏿‍💼',desc:'Gérez vos partenaires d’achat internationaux avec une approche humaine.',stats:[['184','Validés','check'],['5','En revue','clock'],['12','Refusés','alert']],headers:['Fournisseur','Pays','Statut'],rows:[['Gulf Tech Trading','Émirats','Validé'],['Ankara Vision','Turquie','En revue'],['Guangzhou Screen','Chine','Validé'],['Abidjan Tech Distribution',"Côte d’Ivoire",'En revue']]},
{title:'Transitaires',icon:'truck',person:'👷🏿',desc:'Vos partenaires logistiques, leurs zones et leurs délais.',stats:[['6','Partenaires actifs','truck'],['1','À approuver','clock'],['8,4 j','Délai moyen illustratif','plane']],headers:['Transitaire','Type','Pays'],rows:[['Partenaire Air SS','Partenaire','Chine'],['Express international','Express','Turquie'],['Trans-Afrique Cargo','Client',"Côte d’Ivoire"],['Maritime LCL','Partenaire','Émirats']]},
{title:'Paiements et rapprochement',icon:'wallet',person:'👩🏿‍💻',desc:'Suivi des encaissements et des confirmations sécurisées.',stats:[['4,2 M F','Encaissements fictifs','wallet'],['129','Webhooks simulés','shield'],['8','À rapprocher','alert']],headers:['Référence','Client','Moyen'],rows:[['TX-90412','SSD-48213','Carte'],['TX-90377','SSD-48213','Mobile Money'],['TX-90371','SSD-51077','Mobile Money'],['TX-90360','SSD-39950','Google Pay']]},
{title:'Retrait et remboursement',icon:'recharge',person:'👨🏿‍💻',desc:'Demandes sécurisées et historique traçable.',stats:[['312 500 F','Solde fictif','wallet'],['50 000 F','Demande exemple','recharge'],['24–72 h','Délai indicatif','clock']],headers:['Mode','Condition','Statut'],rows:[['Mobile Money','Selon pays','Démo'],['Virement bancaire','Selon pays','Démo'],['Remboursement','Après validation','Démo']]},
{title:'Utilisateurs et rôles',icon:'users',person:'👩🏿‍💻',desc:'Gérez les droits des équipes et les accès par rôle.',stats:[['14','Équipe fictive','users'],['5','Rôles','shield'],['2','Invitations','mail']],headers:['Utilisateur','Rôle','Accès'],rows:[['Marc O.','Administrateur','Tout'],['Koffi A.',"Agent d’achat",'Demandes'],['GZ-04','Agent entrepôt','Réception'],['Fanta K.','Comptable','Paiements'],['Mariam D.','Support','Tickets']]},
{title:'Paramètres',icon:'gear',person:'👩🏿‍💼',desc:'Configurez les pays, devises, frais et moyens de paiement.',stats:[['3','Pays cibles','globe'],['XOF','Devise de démonstration','wallet'],['À valider','Parrainage','gift']],headers:['Paramètre','Valeur affichée','État'],rows:[['Pays','Côte d’Ivoire · Ghana · Guinée','Projet'],['Frais de service','6 % (exemple)','Non validé'],['Parrainage','Règle à définir','Inactif'],['Paiements','Selon pays','Intégrations cibles']]},
{title:'Support et tickets',icon:'support',person:'👩🏿‍💻',desc:'Une assistance chaleureuse et réactive pour les clients.',stats:[['17','Ouverts (exemple)','chat'],['3','Litiges (exemple)','alert'],['22','Résolus (exemple)','check']],headers:['Ticket','Client','Sujet'],rows:[['LIT-2026-0012','SSD-39950','Colis endommagé'],['TCK-2026-0418','SSD-48213','Colis en douane'],['TCK-2026-0417','SSD-51077','Paiement à confirmer']]},
{title:'Moyens de paiement',icon:'card',person:'👩🏿‍💼',desc:'Des options adaptées aux pays, sous réserve de disponibilité.',stats:[['Mobile Money','Cible','mobile'],['Cartes','Cible','card'],['Wallet','À intégrer','wallet']],headers:['Moyen','Usage prévu','Statut'],rows:[['Mobile Money','Afrique','À intégrer'],['Stripe / Cartes','Paiement en ligne','À intégrer'],['Google Pay / Apple Pay','Paiement compatible','À intégrer'],['Alipay / WeChat Pay','Fournisseurs','À intégrer']]}
];
function show(i){const s=screens[i];document.querySelectorAll('[data-index]').forEach(x=>x.classList.toggle('active',Number(x.dataset.index)===i));const icon=n=>'<img src="'+root+n+'.png" alt="">';document.getElementById('screen').innerHTML='<div class="hero"><div><h1>'+s.title+'</h1><p>'+s.desc+'</p></div><div class="person" aria-hidden="true">'+s.person+'</div></div><div class="motif"></div><div class="metrics">'+s.stats.map(v=>'<div class="tile">'+icon(v[2])+'<strong>'+v[0]+'</strong><small>'+v[1]+'</small></div>').join('')+'</div><div class="panel"><h3>'+s.title+' · Aperçu</h3><table><thead><tr>'+s.headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+s.rows.map(r=>'<tr>'+r.map((x,j)=>'<td>'+(j===2?'<span class="pill">'+x+'</span>':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="notice">◆ ◇ ◆ Design inspiré du bogolan · Palette bleu, rouge, blanc et bleu nuit · Données de démonstration</div>';}
screens.forEach((s,i)=>{for(const id of ['toolbar','side']){const b=document.createElement('button');b.dataset.index=i;b.innerHTML=id==='side'?'<img src="'+root+s.icon+'.png" alt=""> '+s.title:s.title;b.onclick=()=>show(i);document.getElementById(id).appendChild(b)}});show(0);
</script></body></html>
